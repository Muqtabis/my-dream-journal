<!DOCTYPE html>
<html lang="en" data-theme="dark">

    <meta charset="utf-8" />

    <!-- Single Page Apps for GitHub Pages routing -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&') 
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>

    <!-- Search Engine Optimization (SEO) -->
    <title>Dream Journal & AI Dream Visualizer — Subconscious Mind Exploration</title>
    <meta

      content="Capture, decode, and visually explore your dreams with our AI Dream Interpreter & Visualizer. Discover Jungian archetypes, subconscious meanings, and custom dream artwork."
    />

      content="dream journal, dream interpreter, dream visualizer, AI dream analysis, Jungian archetypes, subconscious analysis, dream symbols, dream art generator"
    />
    <meta name="author" content="Dream Journal" />
